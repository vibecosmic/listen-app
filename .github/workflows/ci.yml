name: Repository checks
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, unlabeled]
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.x'
      - run: python scripts/check_repository.py
  automerge:
    # ADR 0009 (vibecosmic/aos): merge automatically once every CI job passed.
    # Same-repository PRs only (never forks); skip drafts and held PRs; merge
    # exactly the tested head commit; one merge at a time per repository.
    needs: [metadata]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      !contains(github.event.pull_request.labels.*.name, 'aos:hold') &&
      !contains(github.event.pull_request.labels.*.name, 'aos:no-automerge')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: automerge-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - run: gh pr merge "$PR" --repo "$REPO" --squash --match-head-commit "$SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
