name: Flutter web validation
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  flutter-web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check Flutter project is present
        id: project
        shell: bash
        run: |
          if [[ -f pubspec.yaml ]]; then
            [[ -f web/index.html ]] || { echo "::error::web/index.html missing"; exit 1; }
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No pubspec.yaml; Flutter project not yet present."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: subosito/flutter-action@v2
        if: steps.project.outputs.ready == 'true'
        with:
          channel: stable
          cache: true
      - name: Generate or verify dependency lockfile
        if: steps.project.outputs.ready == 'true'
        id: deps
        shell: bash
        run: |
          if [[ -f pubspec.lock ]]; then
            flutter pub get --enforce-lockfile
            echo "generated=false" >> "$GITHUB_OUTPUT"
          else
            flutter pub get
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload generated lockfile for author commit
        if: steps.project.outputs.ready == 'true' && steps.deps.outputs.generated == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flutter-pubspec-lock-${{ github.sha }}
          path: pubspec.lock
          if-no-files-found: error
          retention-days: 7
      - name: Require committed lockfile
        if: steps.project.outputs.ready == 'true' && steps.deps.outputs.generated == 'true'
        run: |
          echo "::error::pubspec.lock is missing. Download the generated lockfile artifact and commit it to this PR branch."
          exit 1
      - name: Analyze
        if: steps.project.outputs.ready == 'true'
        run: flutter analyze
      - name: Test
        if: steps.project.outputs.ready == 'true'
        run: flutter test
      - name: Build web
        if: steps.project.outputs.ready == 'true'
        run: flutter build web --release
      - name: Upload web build
        if: steps.project.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flutter-web-${{ github.sha }}
          path: build/web/
          if-no-files-found: error
          retention-days: 7
